name: License Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-license-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install addlicense
        run: go install github.com/google/addlicense@latest

      - name: Verify License Headers
        run: |
          addlicense -check \
            -ignore "**/*.md" \
            -ignore "**/*.txt" \
            -ignore "**/*.bib" \
            -ignore "**/*.json" \
            -ignore "**/*.yaml" \
            -ignore "**/*.yml" \
            -ignore "**/*.toml" \
            -ignore "**/*.lock" \
            -ignore "**/*.ipynb" \
            -ignore "**/*.png" \
            -ignore "**/*.gif" \
            -ignore "**/*.svg" \
            -ignore "**/*.drawio" \
            -ignore "**/*.npz" \
            -ignore "**/*.typed" \
            -ignore "LICENSE*" \
            -ignore "NOTICE" \
            -ignore "THIRD-PARTY-LICENSES.md" \
            . || (echo -e "\n❌ License headers are missing on some files.\nPlease run 'make license-add' locally to insert standard headers." && exit 1)