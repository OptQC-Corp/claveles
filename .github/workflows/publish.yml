name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Patch version files
        run: |
          if [ -n "$VERSION" ]; then
            uv run --no-project python tools/patch_version.py --version "$VERSION" --meta
          else
            uv run --no-project python tools/patch_version.py --meta
          fi

      - name: Rewrite relative URLs in README
        run: |
          find . -name "README.md" -type f -exec sed -i -E 's|!\[([^\]]*)\]\(\./?([^)]*)\)|![\1](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/\2)|g' {} +
          find . -name "README.md" -type f -exec sed -i -E 's|\[([^\]]*)\]\(\./?([^)]*)\)|[\1](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/\2)|g' {} +

      - name: Check substituted README
        run: cat README.md

      - name: Build core distributions
        run: uv build --out-dir dist/core --no-create-gitignore

      - name: Build meta distributions
        run: uv build meta --out-dir dist/meta --no-create-gitignore

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, meta]
    environment: testpypi-${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload ${{ matrix.package }} to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/${{ matrix.package }}

  publish-pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, meta]
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/${{ matrix.package }}